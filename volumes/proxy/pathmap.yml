loglevel: "warn"
paths:
  - source: "/"
    maptype: "proxy"
    target: "http://django:8000/"

  - source: "/admin/"
    maptype: "proxy"
    target: "http://django:8000/admin/"
    authgroups:
      - "kdl-staff"
      - "mpol"

  - source: "/static/"
    maptype: "files"
    target: "/www/static/"

  - source: "/robots.txt"
    maptype: "single-file"
    target: "/www/robots.txt"
